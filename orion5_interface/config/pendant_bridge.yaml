# pendant_bridge.py common parameters (loaded into the node's private namespace). The workcell (cell/world, planning
# scene, handled objects, pose search groups) is config/workcell.yaml and the tasks are config/tasks.yaml; both are
# loaded by mery6_simulation.launch after this file. Simulation only. No PID gains, no hardware settings here.

status_rate: 10.0          # Hz, /pendant/status
joint_tol_rad: 0.02        # completion check: |live - target| per joint (~1.1 deg)
vel_tol_rad_s: 0.02        # completion check: joint must be (nearly) stopped
settle_time: 0.2           # s, tolerance must hold this long
default_speed_pct: 30      # MoveIt velocity/acceleration scaling (percent)
wall_cap_factor: 4.0       # wall-clock cap = factor x (simulation-time) timeout / measured RTF, see README "simulation time"
plan_retries: 1            # re-plan a planner-side failure (OMPL TIMED_OUT / PLANNING_FAILED) at most this many times; visible in
                           # the step note and the task history (replanN). Collision / invalid-goal failures are never retried.

# MC1 gripper (degrees on the left finger joints, right joints are mirrored by the service).
# Close direction verified in Gazebo (Phase B). "CLOSED" means the fingers reached this angle; the object itself is
# carried by a kinematic link attachment (see objects: in config/workcell.yaml), not by finger contact forces.
gripper_open_deg: 0.0
gripper_close_deg: 35.0
gripper_time: 1.0
gripper_tol_deg: 2.0

# Cartesian (straight-line) motion: compute_cartesian_path step, jog acceptance fraction,
# and a configuration-flip guard (max joint change between consecutive path points).
cartesian_eef_step: 0.005
cartesian_min_fraction: 0.95          # jog only; task cartesian_to steps require 1.0 unless the step says otherwise
cartesian_max_joint_jump_rad: 0.35

# Named joint poses in degrees. HOME = all zero (same as SRDF 'home', verified in Phase A).
# Every other pose is TAUGHT by the operator in Gazebo with the pendant "Teach" button and stored in
# config/taught_poses.yaml (set by the launch file); find_task_poses.py --write-taught may add tool-selected poses.
named_poses:
  HOME: [0, 0, 0, 0, 0, 0]

# Approximate gripper collision envelope attached to eef_link in the MoveIt planning scene (planning only;
# Gazebo physics is unchanged). Size from the MC1 meshes: body 0.07 x 0.07 x 0.0985 m, fingertip TCP at 0.17 m.
# The open fingers (along +-x) are not covered.
gripper_envelope:
  enabled: true
  size: [0.07, 0.07, 0.17]
  z_offset: 0.085

# Gazebo robot model / frame rule shared by all tasks (robot spawned at z:=0.4 on a 0.4 m pedestal).
robot_model: orion5_v166               # Gazebo model name of the robot (spawn_model -model)
gazebo_z_offset: 0.40
gripper_link_candidates: [gripper_base, eef_link, link_6]   # Gazebo lumps fixed-joint links; first one present is used

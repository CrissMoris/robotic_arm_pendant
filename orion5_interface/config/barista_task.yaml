# Barista validation task for pendant_bridge.py (loaded into ~tasks). Phase D sequence + Phase E object handling.
#
# Step types:
#   state_check      {}                                  no motion: fresh joint states, arm stationary, current state
#                                                        collision-free (/check_state_validity); fails the task otherwise
#   scene_reset      {object}                            Gazebo: detach the object if attached and put it back at its start
#                                                        pose (set_model_state); verifies it is there. No robot motion.
#   named_if_needed  {pose, unless_reachable}            moves to `pose` ONLY if needed: skipped when already there or when
#                                                        a direct collision-checked OMPL plan to `unless_reachable` exists
#                                                        (planning only, that plan is never executed)
#   named            {pose}                              MoveIt joint-space plan to a pose name (named_poses -> taught -> SRDF)
#   cartesian_to     {pose, dxyz?, min_fraction?}        straight-line TCP move to a TAUGHT pose's stored TCP (+ base_link
#                                                        offset), avoid_collisions=True, 100 % path required by default
#   gripper          {action: open|close}                MC1 service + finger-position verification
#   attach / detach  {object}                            kinematic link attachment between the gripper link and the object
#                                                        (gazebo_ros_link_attacher); attach is refused if the TCP is not at
#                                                        the object. Simulation substitute for a physics grasp.
#   verify_object    {object, expect: lifted|at_place|at_start|attached, tol_m?}  measured check of the object pose
#   cartesian_offset {dxyz, drpy_deg}  /  wait {seconds}
#
# Poses: HOME comes from named_poses (pendant_bridge.yaml). READY, PRE_PICK, PICK, PRE_PLACE and PLACE are the
# operator-taught poses in taught_poses.yaml (pendant: Jog page -> Teach). Their values are referenced by name only and
# are never modified by this file or by the bridge. run_task refuses to start while any of them is missing.
#
# Sequence (18 steps): no leading HOME/READY motions, no TRANSFER return after the pick. SCENE_RESET makes every cycle
# start with the cup at the pick point, so the task can be repeated (regression tests). The lift after the pick
# (RETRACT_PICK) and the retract after the place (RETRACT_PLACE) are straight-line moves; the transfer
# RETRACT_PICK -> PRE_PLACE is a collision-checked joint-space plan. VERIFY_LIFT proves the cup moved with the gripper,
# VERIFY_PLACE proves it rests on the place pad. HOME is the mandatory final step of every successfully completed cycle.
# A failed or stopped task performs no automatic motion and does NOT detach the cup; the operator decides
# (pendant: "Sahneyi sıfırla" = reset_scene, or detach).
#
# Limitation: the cup is carried by a kinematic fixed joint, not by finger contact forces (the MC1 fingers have no
# collision geometry). GRIPPER_CLOSE verifies the finger angle; ATTACH_CUP creates the joint.

tasks:
  barista:
    description: "Pick the cup at the coffee machine side and place it on the service pad (simulation validation, kinematic attachment)"
    steps:
      - {name: STATE_CHECK,     type: state_check}
      - {name: SCENE_RESET,     type: scene_reset,   object: cup}
      - {name: READY_IF_NEEDED, type: named_if_needed, pose: READY, unless_reachable: PRE_PICK, speed: 30}
      - {name: PRE_PICK,        type: named,         pose: PRE_PICK,  speed: 30}
      - {name: APPROACH_PICK,   type: cartesian_to,  pose: PICK,      dxyz: [0.0, 0.0, 0.03], speed: 15}
      - {name: GRIPPER_OPEN,    type: gripper,       action: open}
      - {name: PICK,            type: cartesian_to,  pose: PICK,      speed: 10}
      - {name: GRIPPER_CLOSE,   type: gripper,       action: close}
      - {name: ATTACH_CUP,      type: attach,        object: cup}
      - {name: RETRACT_PICK,    type: cartesian_to,  pose: PRE_PICK,  speed: 15}
      - {name: VERIFY_LIFT,     type: verify_object, object: cup, expect: lifted}
      - {name: PRE_PLACE,       type: named,         pose: PRE_PLACE, speed: 30}
      - {name: PLACE,           type: cartesian_to,  pose: PLACE,     speed: 10}
      - {name: RELEASE,         type: gripper,       action: open}
      - {name: DETACH_CUP,      type: detach,        object: cup}
      - {name: RETRACT_PLACE,   type: cartesian_to,  pose: PRE_PLACE, speed: 15}
      - {name: VERIFY_PLACE,    type: verify_object, object: cup, expect: at_place}
      - {name: HOME,            type: named,         pose: HOME,      speed: 30}

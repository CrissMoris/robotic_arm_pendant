# Scenario: Barista (moved verbatim from pendant_bridge.yaml / tasks.yaml on 2026-10-26; no values changed).
# A scenario = Gazebo world + MoveIt planning-scene workcell + handled objects + tasks (+ its taught poses file,
# config/scenarios/<name>_taught_poses.yaml, set by the launch file). Start with:
#   roslaunch orion5_interface mery6_simulation.launch scenario:=barista
# Common bridge settings (tolerances, gripper, cartesian, envelope, robot model) live in pendant_bridge.yaml.

scenario:
  name: barista
  description: "Barista workcell: pick the cup at the coffee machine side and place it on the service pad"
  world: barista.world        # orion5_description/world/
  spawn_z: 0.40               # robot base height (launch arg z); z_base = z_gazebo - 0.40

# Workcell collision objects for the MoveIt planning scene, in base_link coordinates.
# The cup is deliberately NOT listed: it is the manipulation target.
workcell:
  - {name: floor,          shape: box, size: [3.0, 3.0, 0.01],  xyz: [0.0,  0.0, -0.405]}
  - {name: pedestal,       shape: box, size: [0.20, 0.20, 0.38], xyz: [0.0,  0.0, -0.21]}    # top at -0.02: 2 cm gap to base_link
  - {name: table,          shape: box, size: [0.60, 0.80, 0.03], xyz: [0.55, 0.0,  0.0]}     # top surface at +0.015
  - {name: coffee_machine, shape: box, size: [0.20, 0.30, 0.40], xyz: [0.75, 0.0,  0.215]}
  - {name: place_pad,      shape: box, size: [0.15, 0.15, 0.01], xyz: [0.42, 0.15, 0.02]}

# Gazebo objects handled by task steps (scene_reset / attach / detach / verify_object). SIMULATION ONLY:
# attach = kinematic fixed joint created by the gazebo_ros_link_attacher world plugin; not a physics grasp.
objects:
  - name: cup
    gazebo_model: cup
    gazebo_link: link
    start_xyz_base: [0.42, -0.15, 0.065]   # cup centre at the pick point (bottom on the table top at 0.015)
    start_rpy_deg: [0, 0, 0]
    place_xyz_base: [0.42, 0.15, 0.075]    # cup centre when resting on the place pad (top 0.025 + half height 0.05)
    tolerance_m: 0.03
    attach_radius_m: 0.08
    min_lift_m: 0.03

# Inputs for scripts/find_task_poses.py --scenario barista (candidate poses only; the operator teaches the final ones)
pose_search:
  ready_pose: READY
  targets:
    PICK:  {xyz: [0.42, -0.15, 0.065], pre: PRE_PICK}
    PLACE: {xyz: [0.42,  0.15, 0.075], pre: PRE_PLACE}

# Task: 18 steps. SCENE_RESET makes every cycle start with the cup at the pick point. RETRACT_PICK / RETRACT_PLACE are
# straight-line moves; RETRACT_PICK -> PRE_PLACE is a collision-checked joint-space plan. VERIFY_LIFT proves the cup moved
# with the gripper, VERIFY_PLACE proves it rests on the pad. HOME is the mandatory final step of a successful cycle.
# A failed or stopped task performs no automatic motion and does NOT detach the cup.
tasks:
  barista:
    description: "Pick the cup at the coffee machine side and place it on the service pad (simulation validation, kinematic attachment)"
    steps:
      - {name: STATE_CHECK,     type: state_check}
      - {name: SCENE_RESET,     type: scene_reset,   object: cup}
      - {name: READY_IF_NEEDED, type: named_if_needed, pose: READY, unless_reachable: PRE_PICK, speed: 30}
      - {name: PRE_PICK,        type: named,         pose: PRE_PICK,  speed: 30}
      - {name: APPROACH_PICK,   type: cartesian_to,  pose: PICK,      dxyz: [0.0, 0.0, 0.03], speed: 15}
      - {name: GRIPPER_OPEN,    type: gripper,       action: open}
      - {name: PICK,            type: cartesian_to,  pose: PICK,      speed: 10}
      - {name: GRIPPER_CLOSE,   type: gripper,       action: close}
      - {name: ATTACH_CUP,      type: attach,        object: cup}
      - {name: RETRACT_PICK,    type: cartesian_to,  pose: PRE_PICK,  speed: 15}
      - {name: VERIFY_LIFT,     type: verify_object, object: cup, expect: lifted}
      - {name: PRE_PLACE,       type: named,         pose: PRE_PLACE, speed: 30}
      - {name: PLACE,           type: cartesian_to,  pose: PLACE,     speed: 10}
      - {name: RELEASE,         type: gripper,       action: open}
      - {name: DETACH_CUP,      type: detach,        object: cup}
      - {name: RETRACT_PLACE,   type: cartesian_to,  pose: PRE_PLACE, speed: 15}
      - {name: VERIFY_PLACE,    type: verify_object, object: cup, expect: at_place}
      - {name: HOME,            type: named,         pose: HOME,      speed: 30}

# Task definitions for pendant_bridge.py (loaded into ~tasks). All tasks run in the single workcell
# (config/workcell.yaml, world/mery6_workcell.world) and appear in the pendant's task list; each task uses its own
# taught poses and its own handled object. Poses are referenced by name only (config/taught_poses.yaml); the Barista
# poses are operator-taught, the CONV_* poses are selected by scripts/find_task_poses.py --group conveyor --write-taught.
#
# Step types:
#   state_check      {}                                  no motion: fresh joint states, arm stationary, current state valid
#   scene_reset      {object}                            Gazebo: detach the object if attached and put it back at its start
#   named_if_needed  {pose, unless_reachable}            moves to `pose` only if needed (planning-only feasibility check)
#   named            {pose}                              MoveIt joint-space plan to a pose name (named_poses -> taught -> SRDF)
#   cartesian_to     {pose, dxyz?, min_fraction?}        straight-line TCP move to a TAUGHT pose's stored TCP (+ offset)
#   gripper          {action: open|close}                MC1 service + finger-position verification
#   attach / detach  {object}                            kinematic link attachment (gazebo_ros_link_attacher), not a physics grasp
#   verify_object    {object, expect: lifted|at_place|at_start|attached, tol_m?}  measured check of the object pose
#   verify_tcp       {pose, tol_m?, tol_deg?}            measured check: current TCP vs the taught pose's stored TCP
#   cartesian_offset {dxyz, drpy_deg}  /  wait {seconds}
#
# Common skeleton (18 steps): STATE_CHECK, SCENE_RESET, READY_IF_NEEDED, PRE_PICK, APPROACH_PICK, GRIPPER_OPEN, PICK,
# GRIPPER_CLOSE, ATTACH, RETRACT_PICK, VERIFY_LIFT, PRE_PLACE, PLACE, RELEASE, DETACH, RETRACT_PLACE, VERIFY_PLACE, HOME.
# HOME is the mandatory final step of a successful cycle; a failed or stopped task performs no automatic motion and does
# not detach the object. Every finished cycle is appended to the task history CSV.

tasks:

  barista:
    description: "Pick the cup at the coffee machine side and place it on the service pad (kinematic attachment)"
    steps:
      - {name: STATE_CHECK,     type: state_check}
      - {name: SCENE_RESET,     type: scene_reset,   object: cup}
      - {name: READY_IF_NEEDED, type: named_if_needed, pose: READY, unless_reachable: PRE_PICK, speed: 30}
      - {name: PRE_PICK,        type: named,         pose: PRE_PICK,  speed: 30}
      - {name: APPROACH_PICK,   type: cartesian_to,  pose: PICK,      dxyz: [0.0, 0.0, 0.03], speed: 15}
      - {name: GRIPPER_OPEN,    type: gripper,       action: open}
      - {name: PICK,            type: cartesian_to,  pose: PICK,      speed: 10}
      - {name: GRIPPER_CLOSE,   type: gripper,       action: close}
      - {name: ATTACH_CUP,      type: attach,        object: cup}
      - {name: RETRACT_PICK,    type: cartesian_to,  pose: PRE_PICK,  speed: 15}
      - {name: VERIFY_LIFT,     type: verify_object, object: cup, expect: lifted}
      - {name: PRE_PLACE,       type: named,         pose: PRE_PLACE, speed: 30}
      - {name: PLACE,           type: cartesian_to,  pose: PLACE,     speed: 10}
      - {name: RELEASE,         type: gripper,       action: open}
      - {name: DETACH_CUP,      type: detach,        object: cup}
      - {name: RETRACT_PLACE,   type: cartesian_to,  pose: PRE_PLACE, speed: 15}
      - {name: VERIFY_PLACE,    type: verify_object, object: cup, expect: at_place}
      - {name: HOME,            type: named,         pose: HOME,      speed: 30}

  conveyor_pick_place:
    description: "Pick the product box from the input belt and place it on the output belt (static belts, kinematic attachment)"
    steps:
      - {name: STATE_CHECK,     type: state_check}
      - {name: SCENE_RESET,     type: scene_reset,   object: product}
      - {name: READY_IF_NEEDED, type: named_if_needed, pose: CONV_READY, unless_reachable: CONV_PRE_PICK, speed: 30}
      - {name: PRE_PICK,        type: named,         pose: CONV_PRE_PICK,  speed: 30}
      - {name: APPROACH_PICK,   type: cartesian_to,  pose: CONV_PICK,      dxyz: [0.0, 0.0, 0.03], speed: 15}
      - {name: GRIPPER_OPEN,    type: gripper,       action: open}
      - {name: PICK,            type: cartesian_to,  pose: CONV_PICK,      speed: 10}
      - {name: GRIPPER_CLOSE,   type: gripper,       action: close}
      - {name: ATTACH_PRODUCT,  type: attach,        object: product}
      - {name: RETRACT_PICK,    type: cartesian_to,  pose: CONV_PRE_PICK,  speed: 15}
      - {name: VERIFY_LIFT,     type: verify_object, object: product, expect: lifted}
      - {name: PRE_PLACE,       type: named,         pose: CONV_PRE_PLACE, speed: 30}
      - {name: PLACE,           type: cartesian_to,  pose: CONV_PLACE,     speed: 10}
      - {name: RELEASE,         type: gripper,       action: open}
      - {name: DETACH_PRODUCT,  type: detach,        object: product}
      - {name: RETRACT_PLACE,   type: cartesian_to,  pose: CONV_PRE_PLACE, speed: 15}
      - {name: VERIFY_PLACE,    type: verify_object, object: product, expect: at_place}
      - {name: HOME,            type: named,         pose: HOME,           speed: 30}
